name: Build

# CI build (ad-hoc signed) for main, pull requests and manual runs.
# Releases are built, signed, notarized and published by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Multipaste.app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build, sign and package
        env:
          REQUIRE_UNIVERSAL: "1"
        run: bash Scripts/build_app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Multipaste
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
