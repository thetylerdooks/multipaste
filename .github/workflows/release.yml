name: Release

# Builds a universal Multipaste.app, signs it with the Developer ID certificate,
# notarizes and staples the app and the DMG, and publishes a GitHub release.
# Pushing a v* tag releases. Running it by hand (Actions > Release > Run
# workflow) on a branch is a dry run: everything is built, signed and notarized
# and uploaded as workflow artifacts, but nothing is published.
# See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize and publish
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Temporary paths for signing material
        run: |
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/multipaste-signing.keychain-db"
            echo "CERT_PATH=$RUNNER_TEMP/multipaste-signing.p12"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/multipaste-notary.p8"
          } >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                      APPSTORE_API_KEY_P8_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Repository secret $name is missing or empty (see RELEASING.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$file_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$version' (from ref '$REF_NAME') is not of the form 1.2.3"
            exit 1
          fi
          if [[ "$version" != "$file_version" ]]; then
            echo "::warning::Building $version but the VERSION file says $file_version. Consider bumping VERSION."
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The .p12 was exported from Keychain Access (legacy RC2-40);
          # `security import` reads it as-is, so it is not converted.
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          # Remember the current default keychain so cleanup can restore it.
          original_default="$(security default-keychain -d user | tr -d ' "')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_default" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null

          # Put the temporary keychain first in the search list and make it the default.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Pick the Developer ID Application identity for our team, by SHA-1 hash.
          echo "::add-mask::$APPLE_TEAM_ID"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          match="$(printf '%s\n' "$identities" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -n 1 || true)"
          if [[ -z "$match" ]]; then
            echo "::error::No valid 'Developer ID Application' identity for APPLE_TEAM_ID found in the imported certificate"
            printf '%s\n' "$identities" | tail -n 1
            exit 1
          fi
          identity_hash="$(printf '%s\n' "$match" | awk '{print $2}')"
          echo "::add-mask::$identity_hash"
          echo "SIGN_IDENTITY=$identity_hash" >> "$GITHUB_ENV"
          echo "Using a Developer ID Application identity from the temporary keychain"

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | tr -d '\r\n ' | base64 --decode > "$NOTARY_KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$NOTARY_KEY_PATH"; then
            echo "::error::APPSTORE_API_KEY_P8_BASE64 does not decode to a .p8 private key"
            exit 1
          fi

      - name: Build and sign (Developer ID, hardened runtime)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRE_UNIVERSAL: "1"
        run: bash Scripts/build_app.sh

      - name: Notarize and staple the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          # build_app.sh made a ZIP of the signed app; that is what gets submitted.
          bash Scripts/notarize.sh "build/Multipaste-$VERSION.zip"
          xcrun stapler staple build/Multipaste.app
          xcrun stapler validate build/Multipaste.app
          codesign --verify --strict --deep --verbose=2 build/Multipaste.app
          spctl -a -t exec -vv build/Multipaste.app

      - name: Package the stapled app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash Scripts/package_app.sh "$VERSION"

      - name: Sign, notarize and staple the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          dmg="build/Multipaste-$VERSION.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          bash Scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"

      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build
          sums="Multipaste-$VERSION-SHA256SUMS.txt"
          shasum -a 256 "Multipaste-$VERSION.dmg" "Multipaste-$VERSION.zip" > "$sums"
          cat "$sums"
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Multipaste-${{ steps.version.outputs.version }}-notarized
          path: |
            build/*.dmg
            build/*.zip
            build/*-SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multipaste ${{ steps.version.outputs.version }}
          files: |
            build/*.dmg
            build/*.zip
            build/*-SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## Install

            1. Download `Multipaste-${{ steps.version.outputs.version }}.dmg` below, open it and drag **Multipaste** into **Applications**.
            2. Open Multipaste from Applications. It is signed with an Apple Developer ID and notarized by Apple, so it opens normally.
            3. Allow **Accessibility** when asked, so Multipaste can press ⌘V for you.
            4. Press **⇧⌘V** anywhere to open your clipboard history.

            Multipaste is fully local and contains no networking code. SHA-256 checksums are in `Multipaste-${{ steps.version.outputs.version }}-SHA256SUMS.txt`.

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "${CERT_PATH:-}" "${NOTARY_KEY_PATH:-}"
          echo "Signing keychain and key files removed"
